<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ToDoアプリ</title>
</head>
<body>
  <h1>ToDoリスト</h1>
  <form method="post">
    {% csrf_token %}
    <input type="text" name="title" placeholder="やることを入力" />
    <button type="submit">追加</button>
  </form>
  <ul>
    {% for task in tasks %}
      <li>
        {% if task.is_completed %}<s>{{ task.title }}</s>{% else %}{{ task.title }}{% endif %}
        <a href="{% url 'toggle_task' task.pk %}">完了切替</a>
        <a href="{% url 'delete_task' task.pk %}">削除</a>
      </li>
    {% empty %}
      <li>タスクはまだありません</li>
    {% endfor %}
  </ul>
</body>
</html>
